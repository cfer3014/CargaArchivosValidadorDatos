<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sales Analytics Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1700px;
    margin:auto;
}

header{
    text-align:center;
    color:white;
    margin-bottom:30px;
}

header h1{
    font-size:2.5rem;
    margin-bottom:8px;
}

.upload-section,
.chart-container,
.card,
.tab-content,
.filters-section{
    background:white;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.upload-section{
    padding:30px;
    margin-bottom:25px;
}

.mode-selector{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    justify-content:center;
}

.mode-btn{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#eee;
    font-weight:600;
}

.mode-btn.active{
    background:#667eea;
    color:white;
}

.upload-area{
    border:3px dashed #667eea;
    border-radius:12px;
    padding:40px;
    text-align:center;
    transition:.3s;
    background:#f8f9ff;
    cursor:pointer;
}

.upload-area.dragover{
    background:#eef1ff;
    border-color:#764ba2;
}

.upload-area input{
    display:none;
}

.btn{
    border:none;
    border-radius:8px;
    padding:10px 20px;
    cursor:pointer;
    font-weight:600;
}

.btn-primary{
    background:#667eea;
    color:white;
}

.btn-secondary{
    background:#f1f1f1;
}

.btn-danger{
    background:#ff4d4f;
    color:white;
}

.btn-download{
    background:#12b886;
    color:white;
}

.files-list{
    margin-top:25px;
}

.file-item{
    background:#f8f9ff;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-bottom:12px;
}

.file-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.file-name{
    font-weight:700;
    color:#333;
}

.file-meta{
    font-size:.85rem;
    color:#666;
    margin-top:5px;
}

.progress{
    width:100%;
    height:10px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#667eea,#764ba2);
    transition:width .3s;
}

.summary-cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    padding:25px;
}

.card-title{
    color:#666;
    margin-bottom:10px;
}

.card-value{
    font-size:2rem;
    font-weight:700;
    color:#667eea;
}

.charts-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(450px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.chart-container{
    padding:20px;
}

.chart-title{
    margin-bottom:15px;
    font-weight:700;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:0;
    flex-wrap:wrap;
}

.tab-btn{
    padding:12px 20px;
    border:none;
    background:white;
    border-radius:10px 10px 0 0;
    cursor:pointer;
    font-weight:600;
}

.tab-btn.active{
    background:#667eea;
    color:white;
}

.tab-content{
    display:none;
    padding:20px;
    overflow:auto;
    margin-bottom:20px;
}

.tab-content.active{
    display:block;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f5f5f5;
    padding:12px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#fafafa;
}

.loading{
    display:none;
    text-align:center;
    padding:25px;
}

.loading.show{
    display:block;
}

.spinner{
    width:40px;
    height:40px;
    border:4px solid #eee;
    border-top:4px solid #667eea;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto auto 10px;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

.results-section{
    display:none;
}

.results-section.show{
    display:block;
}

.action-buttons{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.error{
    background:#ffeaea;
    color:#d60000;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
    display:none;
}

.error.show{
    display:block;
}

@media(max-width:768px){

    .charts-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<header>
    <h1>📊 Sales Analytics Pro</h1>
    <p>Dashboard avanzado de análisis</p>
</header>

<div class="upload-section">

    <div class="mode-selector">
        <button class="mode-btn active" onclick="setMode('single',event)">
            📄 Un archivo
        </button>

        <button class="mode-btn" onclick="setMode('multiple',event)">
            📁 Múltiples archivos
        </button>
    </div>

    <div class="upload-area" id="uploadArea">

        <div style="font-size:3rem;margin-bottom:10px;">
            📂
        </div>

        <h2 id="uploadTitle">
            Carga tus archivos
        </h2>

        <p style="margin:10px 0 20px;">
            Arrastra archivos o haz clic
        </p>

        <input
            type="file"
            id="fileInput"
            accept=".csv,.xlsx,.xls"
        />

        <button
            class="btn btn-primary"
            onclick="document.getElementById('fileInput').click()"
        >
            Seleccionar
        </button>

    </div>

    <div class="files-list" id="filesList"></div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Procesando...</p>
    </div>

    <div class="error" id="error"></div>

</div>

<div class="results-section" id="resultsSection">

    <div class="action-buttons">

        <button
            class="btn btn-download"
            onclick="downloadExcel()"
        >
            📊 Excel
        </button>

        <button
            class="btn btn-download"
            onclick="downloadCSV()"
        >
            📋 CSV
        </button>

        <button
            class="btn btn-secondary"
            onclick="resetApp()"
        >
            🔄 Reiniciar
        </button>

    </div>

    <div class="summary-cards">

        <div class="card">
            <div class="card-title">
                Clientes
            </div>
            <div class="card-value" id="totalClientes">0</div>
        </div>

        <div class="card">
            <div class="card-title">
                Compras
            </div>
            <div class="card-value" id="totalCompras">0</div>
        </div>

        <div class="card">
            <div class="card-title">
                Monto Total
            </div>
            <div class="card-value" id="montoTotal">$0</div>
        </div>

        <div class="card">
            <div class="card-title">
                Promedio
            </div>
            <div class="card-value" id="promedioCompra">$0</div>
        </div>

    </div>

    <div class="charts-grid">

        <div class="chart-container">
            <div class="chart-title">Top Clientes</div>
            <canvas id="clientsChart"></canvas>
        </div>

        <div class="chart-container">
            <div class="chart-title">Segmentos</div>
            <canvas id="segmentChart"></canvas>
        </div>

        <div class="chart-container">
            <div class="chart-title">Productos</div>
            <canvas id="productsChart"></canvas>
        </div>

        <div class="chart-container">
            <div class="chart-title">Mensual</div>
            <canvas id="monthlyChart"></canvas>
        </div>

        <!-- NUEVA GRAFICA -->
        <div class="chart-container">
            <div class="chart-title">
                Usuarios por Compras
            </div>
            <canvas id="usersChart"></canvas>
        </div>

    </div>

    <div class="tabs">

        <button
            class="tab-btn active"
            onclick="switchTab('clients',event)"
        >
            👥 Clientes
        </button>

        <button
            class="tab-btn"
            onclick="switchTab('products',event)"
        >
            📦 Productos
        </button>

        <button
            class="tab-btn"
            onclick="switchTab('segments',event)"
        >
            📊 Segmentos
        </button>

        <button
            class="tab-btn"
            onclick="switchTab('monthly',event)"
        >
            📅 Mensual
        </button>

        <!-- NUEVA TAB -->
        <button
            class="tab-btn"
            onclick="switchTab('users',event)"
        >
            🧑 Usuarios
        </button>

    </div>

    <div class="tab-content active" id="clients-tab">
        <table id="clientsTable">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="tab-content" id="products-tab">
        <table id="productsTable">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="tab-content" id="segments-tab">
        <table id="segmentsTable">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="tab-content" id="monthly-tab">
        <table id="monthlyTable">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- NUEVA TABLA -->
    <div class="tab-content" id="users-tab">
        <table id="usersTable">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

</div>

</div>

<script>

let currentAnalysis = null;
let currentMode = 'single';
let uploadedFiles = [];
let chartInstances = {};

const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');

uploadArea.addEventListener('dragover', e => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
});

uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
});

uploadArea.addEventListener('drop', e => {

    e.preventDefault();

    uploadArea.classList.remove('dragover');

    fileInput.files = e.dataTransfer.files;

    handleFileSelect();

});

fileInput.addEventListener('change', handleFileSelect);

function setMode(mode,event){

    currentMode = mode;

    document
        .querySelectorAll('.mode-btn')
        .forEach(btn => btn.classList.remove('active'));

    event.target.classList.add('active');

    if(mode === 'multiple'){
        fileInput.setAttribute('multiple',true);
    }else{
        fileInput.removeAttribute('multiple');
    }

    resetApp();
}

async function handleFileSelect(){

    const files = [...fileInput.files];

    if(!files.length) return;

    document
        .getElementById('loading')
        .classList.add('show');

    try{

        uploadedFiles = files;

        renderFiles();

        await processFiles();

    }catch(err){

        showError(err.message);

    }finally{

        document
            .getElementById('loading')
            .classList.remove('show');
    }
}

async function processFiles(){

    const formData = new FormData();

    uploadedFiles.forEach(file => {

        if(currentMode === 'single'){
            formData.append('file',file);
        }else{
            formData.append('files',file);
        }

    });

    const endpoint =
        currentMode === 'single'
            ? '/api/upload'
            : '/api/upload-multiple';

    const response = await fetch(endpoint,{
        method:'POST',
        body:formData
    });

    if(!response.ok){
        throw new Error('Error procesando archivos');
    }

    currentAnalysis = await response.json();

    displayResults(currentAnalysis);
}

function renderFiles(){

    const container =
        document.getElementById('filesList');

    container.innerHTML = '';

    uploadedFiles.forEach((file,index)=>{

        const div = document.createElement('div');

        div.className = 'file-item';

        div.innerHTML = `
            <div class="file-top">

                <div>
                    <div class="file-name">
                        ${file.name}
                    </div>

                    <div class="file-meta">
                        ${(file.size/1024).toFixed(2)} KB
                        •
                        ${new Date().toLocaleString()}
                    </div>
                </div>

                <button
                    class="btn btn-danger"
                    onclick="removeFile(${index})"
                >
                    Eliminar
                </button>

            </div>

            <div class="progress">
                <div
                    class="progress-bar"
                    style="width:100%"
                ></div>
            </div>
        `;

        container.appendChild(div);

    });
}

async function removeFile(index){

    uploadedFiles.splice(index,1);

    renderFiles();

    if(uploadedFiles.length === 0){

        resetApp();
        return;
    }

    await processFiles();
}

function displayResults(data){

    document
        .getElementById('resultsSection')
        .classList.add('show');

    document.getElementById('totalClientes')
        .textContent = data.summary.totalClientes;

    document.getElementById('totalCompras')
        .textContent = data.summary.totalCompras;

    document.getElementById('montoTotal')
        .textContent =
        '$'+data.summary.montoTotalCompras.toFixed(2);

    document.getElementById('promedioCompra')
        .textContent =
        '$'+data.summary.promedioCompra.toFixed(2);

    createDynamicTable(
        'clientsTable',
        sanitizeObjects(data.clients)
    );

    createDynamicTable(
        'productsTable',
        sanitizeObjects(data.products)
    );

    createDynamicTable(
        'segmentsTable',
        sanitizeObjects(data.segments)
    );

    createDynamicTable(
        'monthlyTable',
        sanitizeObjects(data.monthly)
    );

    // NUEVA TABLA USUARIOS
    createDynamicTable(
        'usersTable',
        buildUsersData(data.clients)
    );

    displayClientsChart(data.clients);
    displayProductsChart(data.products);
    displaySegmentChart(data.segments);
    displayMonthlyChart(data.monthly);

    // NUEVA GRAFICA
    displayUsersChart(data.clients);
}

function sanitizeObjects(data){

    return data.map(item=>{

        const cleaned = {};

        Object.keys(item).forEach(key=>{

            let value = item[key];

            if(typeof value === 'object'){

                if(Array.isArray(value)){

                    value = value
                        .map(v =>
                            typeof v === 'object'
                                ? JSON.stringify(v)
                                : v
                        )
                        .join(', ');

                }else{

                    value = JSON.stringify(value);
                }
            }

            cleaned[key] = value;

        });

        return cleaned;

    });
}

function buildUsersData(clients){

    return clients.map(client => ({

        usuario: client.nombre,
        compras: client.totalCompras,
        monto: client.montoTotal,
        promedio: client.promedio

    }));
}

function createDynamicTable(tableId,data){

    if(!data || !data.length) return;

    const table =
        document.getElementById(tableId);

    const thead =
        table.querySelector('thead');

    const tbody =
        table.querySelector('tbody');

    thead.innerHTML = '';
    tbody.innerHTML = '';

    const columns = Object.keys(data[0]);

    const tr = document.createElement('tr');

    columns.forEach(col=>{

        const th = document.createElement('th');

        th.textContent = col;

        tr.appendChild(th);

    });

    thead.appendChild(tr);

    data.forEach(row=>{

        const tr = document.createElement('tr');

        columns.forEach(col=>{

            const td =
                document.createElement('td');

            td.textContent = row[col];

            tr.appendChild(td);

        });

        tbody.appendChild(tr);

    });
}

function destroyChart(name){

    if(chartInstances[name]){
        chartInstances[name].destroy();
    }
}

function displayClientsChart(clients){

    destroyChart('clients');

    const top = clients.slice(0,10);

    chartInstances.clients = new Chart(
        document.getElementById('clientsChart'),
        {
            type:'bar',
            data:{
                labels:top.map(c=>c.nombre),
                datasets:[{
                    label:'Monto',
                    data:top.map(c=>c.montoTotal),
                    backgroundColor:'#667eea'
                }]
            }
        }
    );
}

function displayProductsChart(products){

    destroyChart('products');

    const top = products.slice(0,10);

    chartInstances.products = new Chart(
        document.getElementById('productsChart'),
        {
            type:'bar',
            data:{
                labels:top.map(p=>p.nombre),
                datasets:[{
                    label:'Cantidad',
                    data:top.map(p=>p.cantidadVendida),
                    backgroundColor:'#764ba2'
                }]
            }
        }
    );
}

function displaySegmentChart(segments){

    destroyChart('segments');

    chartInstances.segments = new Chart(
        document.getElementById('segmentChart'),
        {
            type:'doughnut',
            data:{
                labels:segments.map(s=>s.nombre),
                datasets:[{
                    data:segments.map(s=>s.cantidad),
                    backgroundColor:[
                        '#667eea',
                        '#764ba2',
                        '#12b886',
                        '#ff922b'
                    ]
                }]
            }
        }
    );
}

function displayMonthlyChart(monthly){

    destroyChart('monthly');

    chartInstances.monthly = new Chart(
        document.getElementById('monthlyChart'),
        {
            type:'line',
            data:{
                labels:monthly.map(m=>m.mes),
                datasets:[{
                    label:'Monto',
                    data:monthly.map(m=>m.montoTotal),
                    borderColor:'#667eea',
                    backgroundColor:'rgba(102,126,234,.2)',
                    fill:true
                }]
            }
        }
    );
}

function displayUsersChart(clients){

    destroyChart('users');

    const top = clients.slice(0,10);

    chartInstances.users = new Chart(
        document.getElementById('usersChart'),
        {
            type:'polarArea',
            data:{
                labels:top.map(c=>c.nombre),
                datasets:[{
                    data:top.map(c=>c.totalCompras),
                    backgroundColor:[
                        '#667eea',
                        '#764ba2',
                        '#12b886',
                        '#ff922b',
                        '#339af0',
                        '#845ef7',
                        '#51cf66',
                        '#fcc419',
                        '#ff6b6b',
                        '#20c997'
                    ]
                }]
            }
        }
    );
}

function switchTab(tab,event){

    document
        .querySelectorAll('.tab-btn')
        .forEach(btn=>btn.classList.remove('active'));

    document
        .querySelectorAll('.tab-content')
        .forEach(content=>content.classList.remove('active'));

    event.target.classList.add('active');

    document
        .getElementById(tab+'-tab')
        .classList.add('active');
}

async function downloadExcel(){

    if(!currentAnalysis) return;

    const response =
        await fetch('/api/download-report',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify(currentAnalysis)
        });

    const blob = await response.blob();

    const url =
        window.URL.createObjectURL(blob);

    const a =
        document.createElement('a');

    a.href = url;

    a.download = 'reporte.xlsx';

    a.click();
}

async function downloadCSV(){

    if(!currentAnalysis) return;

    const response =
        await fetch('/api/download-csv',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify(currentAnalysis)
        });

    const blob = await response.blob();

    const url =
        window.URL.createObjectURL(blob);

    const a =
        document.createElement('a');

    a.href = url;

    a.download = 'reporte.csv';

    a.click();
}

function resetApp(){

    uploadedFiles = [];
    currentAnalysis = null;

    document
        .getElementById('resultsSection')
        .classList.remove('show');

    document
        .getElementById('filesList')
        .innerHTML = '';

    fileInput.value = '';
}

function showError(message){

    const div =
        document.getElementById('error');

    div.textContent = message;

    div.classList.add('show');
}

</script>

</body>
</html>
