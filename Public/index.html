<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        Sales Analytics Pro
    </title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            min-height:100vh;
            padding:20px;
        }

        .container{
            max-width:1600px;
            margin:0 auto;
        }

        header{
            text-align:center;
            color:white;
            margin-bottom:30px;
        }

        header h1{
            font-size:2.5em;
            margin-bottom:5px;
            text-shadow:0 2px 10px rgba(0,0,0,.2);
        }

        header p{
            opacity:.9;
        }

        .upload-section{
            background:white;
            border-radius:12px;
            padding:30px;
            margin-bottom:30px;
            box-shadow:0 10px 40px rgba(0,0,0,.1);
        }

        .mode-selector{
            display:flex;
            gap:15px;
            margin-bottom:20px;
            justify-content:center;
            flex-wrap:wrap;
        }

        .mode-btn{
            padding:10px 20px;
            border:2px solid #ddd;
            background:white;
            border-radius:6px;
            cursor:pointer;
            font-weight:600;
            transition:.3s;
        }

        .mode-btn.active{
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            color:white;
            border-color:#667eea;
        }

        .upload-area{
            border:3px dashed #667eea;
            border-radius:10px;
            padding:40px;
            text-align:center;
            cursor:pointer;
            transition:.3s;
            background:#f8f9ff;
        }

        .upload-area:hover,
        .upload-area.dragover{
            border-color:#764ba2;
            background:#e8eaff;
            transform:scale(1.01);
        }

        .upload-area input{
            display:none;
        }

        .btn{
            padding:10px 22px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-weight:600;
            transition:.3s;
        }

        .btn-primary{
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            color:white;
        }

        .btn-secondary{
            background:#f0f0f0;
        }

        .btn-download{
            background:linear-gradient(135deg,#11998e 0%,#38ef7d 100%);
            color:white;
        }

        .btn:hover{
            transform:translateY(-2px);
        }

        .loading{
            display:none;
            text-align:center;
            padding:20px;
        }

        .loading.show{
            display:block;
        }

        .spinner{
            border:4px solid #f3f3f3;
            border-top:4px solid #667eea;
            border-radius:50%;
            width:40px;
            height:40px;
            animation:spin 1s linear infinite;
            margin:0 auto 15px;
        }

        @keyframes spin{
            0%{transform:rotate(0)}
            100%{transform:rotate(360deg)}
        }

        .error{
            background:#fee;
            color:#c33;
            padding:15px;
            border-radius:6px;
            margin-top:20px;
            display:none;
        }

        .error.show{
            display:block;
        }

        .results-section{
            display:none;
        }

        .results-section.show{
            display:block;
        }

        .summary-cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:25px;
        }

        .card{
            background:white;
            border-radius:12px;
            padding:20px;
            box-shadow:0 5px 20px rgba(0,0,0,.08);
        }

        .card-title{
            color:#777;
            margin-bottom:10px;
            font-size:.9em;
        }

        .card-value{
            font-size:2em;
            color:#667eea;
            font-weight:bold;
        }

        .charts-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(450px,1fr));
            gap:20px;
            margin-bottom:25px;
        }

        .chart-container{
            background:white;
            border-radius:12px;
            padding:20px;
            box-shadow:0 5px 20px rgba(0,0,0,.08);
        }

        .chart-title{
            margin-bottom:15px;
            font-weight:bold;
        }

        .tabs{
            display:flex;
            gap:10px;
            background:white;
            padding:15px;
            border-radius:12px 12px 0 0;
            overflow:auto;
        }

        .tab-btn{
            border:none;
            background:none;
            padding:10px 15px;
            cursor:pointer;
            font-weight:600;
            color:#999;
            border-bottom:3px solid transparent;
        }

        .tab-btn.active{
            color:#667eea;
            border-color:#667eea;
        }

        .tab-content{
            display:none;
            background:white;
            padding:20px;
            border-radius:0 0 12px 12px;
            overflow:auto;
        }

        .tab-content.active{
            display:block;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#f5f5f5;
            padding:12px;
            text-align:left;
        }

        td{
            padding:10px;
            border-bottom:1px solid #eee;
        }

        tr:hover{
            background:#fafafa;
        }

        .action-buttons{
            display:flex;
            gap:10px;
            margin-bottom:20px;
            flex-wrap:wrap;
        }

        .file-list-container{
            margin-top:25px;
            display:none;
        }

        .file-list-container.show{
            display:block;
        }

        .file-item{
            background:#f8f9ff;
            border:1px solid #dbe3ff;
            border-radius:10px;
            padding:15px;
            margin-bottom:12px;
        }

        .file-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
        }

        .file-name{
            font-weight:bold;
        }

        .file-meta{
            font-size:.85em;
            color:#666;
            margin-top:5px;
        }

        .progress-bar{
            width:100%;
            height:10px;
            background:#ddd;
            border-radius:20px;
            overflow:hidden;
            margin-top:12px;
        }

        .progress-fill{
            height:100%;
            width:0%;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            transition:.3s;
        }

        .btn-delete{
            background:#ff5252;
            color:white;
            border:none;
            padding:8px 12px;
            border-radius:6px;
            cursor:pointer;
        }

        @media(max-width:768px){

            .charts-grid{
                grid-template-columns:1fr;
            }

            header h1{
                font-size:1.8em;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>📊 Sales Analytics Pro</h1>
        <p>
            Análisis avanzado de ventas
        </p>
    </header>

    <div class="upload-section">

        <div class="mode-selector">

            <button
                class="mode-btn active"
                onclick="setMode('single',event)"
            >
                📄 Un Archivo
            </button>

            <button
                class="mode-btn"
                onclick="setMode('multiple',event)"
            >
                📁 Múltiples Archivos
            </button>

        </div>

        <div
            class="upload-area"
            id="uploadArea"
        >

            <div style="font-size:2.5em;margin-bottom:10px;">
                📁
            </div>

            <h3 id="uploadTitle">
                Carga tu archivo
            </h3>

            <p>
                Arrastra y suelta archivos aquí
            </p>

            <input
                type="file"
                id="fileInput"
                accept=".csv,.xlsx,.xls"
            />

            <br><br>

            <button
                class="btn btn-primary"
                onclick="document.getElementById('fileInput').click()"
            >
                Seleccionar archivo
            </button>

        </div>

        <div
            class="loading"
            id="loading"
        >
            <div class="spinner"></div>
            <p>Procesando...</p>
        </div>

        <div
            class="error"
            id="error"
        ></div>

        <div
            id="fileListContainer"
            class="file-list-container"
        >
            <h3>📂 Archivos cargados</h3>
            <div id="fileList"></div>
        </div>

    </div>

    <div
        class="results-section"
        id="resultsSection"
    >

        <div class="action-buttons">

            <button
                class="btn btn-download"
                onclick="downloadExcel()"
            >
                📊 Excel
            </button>

            <button
                class="btn btn-download"
                onclick="downloadCSV()"
            >
                📋 CSV
            </button>

            <button
                class="btn btn-secondary"
                onclick="resetApp()"
            >
                🔄 Reiniciar
            </button>

        </div>

        <div class="summary-cards">

            <div class="card">
                <div class="card-title">
                    Clientes
                </div>
                <div
                    class="card-value"
                    id="totalClientes"
                >
                    0
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    Compras
                </div>
                <div
                    class="card-value"
                    id="totalCompras"
                >
                    0
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    Monto
                </div>
                <div
                    class="card-value"
                    id="montoTotal"
                >
                    $0
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    Promedio
                </div>
                <div
                    class="card-value"
                    id="promedioCompra"
                >
                    $0
                </div>
            </div>

        </div>

        <div class="charts-grid">

            <div class="chart-container">
                <div class="chart-title">
                    Top Clientes
                </div>
                <canvas id="clientsChart"></canvas>
            </div>

            <div class="chart-container">
                <div class="chart-title">
                    Segmentos
                </div>
                <canvas id="segmentChart"></canvas>
            </div>

            <div class="chart-container">
                <div class="chart-title">
                    Productos
                </div>
                <canvas id="productsChart"></canvas>
            </div>

            <div class="chart-container">
                <div class="chart-title">
                    Tendencia
                </div>
                <canvas id="monthlyChart"></canvas>
            </div>

        </div>

        <div class="tabs">

            <button
                class="tab-btn active"
                onclick="switchTab('clients',event)"
            >
                Clientes
            </button>

            <button
                class="tab-btn"
                onclick="switchTab('products',event)"
            >
                Productos
            </button>

            <button
                class="tab-btn"
                onclick="switchTab('segments',event)"
            >
                Segmentos
            </button>

            <button
                class="tab-btn"
                onclick="switchTab('monthly',event)"
            >
                Mensual
            </button>

        </div>

        <div
            class="tab-content active"
            id="clients-tab"
        >
            <table id="clientsTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>

        <div
            class="tab-content"
            id="products-tab"
        >
            <table id="productsTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>

        <div
            class="tab-content"
            id="segments-tab"
        >
            <table id="segmentsTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>

        <div
            class="tab-content"
            id="monthly-tab"
        >
            <table id="monthlyTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>

    </div>

</div>

<script>

let currentAnalysis = null;
let currentMode = 'single';
let uploadedFiles = [];
let chartInstances = {};

const uploadArea =
    document.getElementById('uploadArea');

const fileInput =
    document.getElementById('fileInput');

uploadArea.addEventListener(
    'dragover',
    e=>{
        e.preventDefault();
        uploadArea.classList.add('dragover');
    }
);

uploadArea.addEventListener(
    'dragleave',
    ()=>{
        uploadArea.classList.remove('dragover');
    }
);

uploadArea.addEventListener(
    'drop',
    e=>{

        e.preventDefault();

        uploadArea.classList.remove('dragover');

        fileInput.files =
            e.dataTransfer.files;

        handleFileSelect();
    }
);

fileInput.addEventListener(
    'change',
    handleFileSelect
);

function setMode(mode,event){

    currentMode = mode;

    document
        .querySelectorAll('.mode-btn')
        .forEach(btn=>{
            btn.classList.remove('active');
        });

    event.target.classList.add('active');

    if(mode === 'multiple'){
        fileInput.setAttribute(
            'multiple',
            true
        );
    }else{
        fileInput.removeAttribute(
            'multiple'
        );
    }

    resetApp();
}

function renderFileList(){

    const container =
        document.getElementById(
            'fileListContainer'
        );

    const list =
        document.getElementById(
            'fileList'
        );

    list.innerHTML = '';

    if(!uploadedFiles.length){

        container.classList.remove('show');

        return;
    }

    container.classList.add('show');

    uploadedFiles.forEach(
        (file,index)=>{

            const div =
                document.createElement('div');

            div.className =
                'file-item';

            div.innerHTML = `
                <div class="file-header">

                    <div>
                        <div class="file-name">
                            📄 ${file.name}
                        </div>

                        <div class="file-meta">
                            ${(file.size/1024).toFixed(2)} KB
                            •
                            ${file.date}
                        </div>
                    </div>

                    <button
                        class="btn-delete"
                        onclick="removeFile(${index})"
                    >
                        Eliminar
                    </button>

                </div>

                <div class="progress-bar">
                    <div
                        class="progress-fill"
                        style="width:${file.progress}%"
                    ></div>
                </div>
            `;

            list.appendChild(div);
        }
    );
}

function removeFile(index){

    uploadedFiles.splice(index,1);

    renderFileList();
}

function simulateProgress(index){

    let progress = 0;

    const interval =
        setInterval(()=>{

            progress += 10;

            if(progress >= 100){

                progress = 100;

                clearInterval(interval);
            }

            uploadedFiles[index].progress =
                progress;

            renderFileList();

        },120);
}

async function handleFileSelect(){

    const files = fileInput.files;

    if(!files.length)
        return;

    document
        .getElementById('loading')
        .classList.add('show');

    try{

        uploadedFiles = [];

        Array.from(files)
        .forEach((file,index)=>{

            uploadedFiles.push({
                name:file.name,
                size:file.size,
                date:new Date()
                    .toLocaleString(),
                progress:0
            });

            simulateProgress(index);
        });

        renderFileList();

        const formData =
            new FormData();

        if(currentMode === 'single'){

            formData.append(
                'file',
                files[0]
            );

            const response =
                await fetch(
                    '/api/upload',
                    {
                        method:'POST',
                        body:formData
                    }
                );

            currentAnalysis =
                await response.json();

        }else{

            for(let file of files){

                formData.append(
                    'files',
                    file
                );
            }

            const response =
                await fetch(
                    '/api/upload-multiple',
                    {
                        method:'POST',
                        body:formData
                    }
                );

            currentAnalysis =
                await response.json();
        }

        displayResults(
            currentAnalysis
        );

    }catch(error){

        showError(error.message);

    }finally{

        document
            .getElementById('loading')
            .classList.remove('show');
    }
}

function displayResults(data){

    document
        .getElementById('totalClientes')
        .textContent =
        data.summary.totalClientes;

    document
        .getElementById('totalCompras')
        .textContent =
        data.summary.totalCompras;

    document
        .getElementById('montoTotal')
        .textContent =
        '$'+
        data.summary.montoTotalCompras
        .toFixed(2);

    document
        .getElementById('promedioCompra')
        .textContent =
        '$'+
        data.summary.promedioCompra
        .toFixed(2);

    createDynamicTable(
        'clientsTable',
        data.clients
    );

    createDynamicTable(
        'productsTable',
        data.products
    );

    createDynamicTable(
        'segmentsTable',
        data.segments
    );

    createDynamicTable(
        'monthlyTable',
        data.monthly
    );

    displayCharts(data);

    document
        .getElementById('resultsSection')
        .classList.add('show');
}

function displayCharts(data){

    createBarChart(
        'clientsChart',
        data.clients
            .slice(0,10)
            .map(c=>c.nombre),
        data.clients
            .slice(0,10)
            .map(c=>c.montoTotal),
        'Monto'
    );

    createBarChart(
        'productsChart',
        data.products
            .slice(0,10)
            .map(p=>p.nombre),
        data.products
            .slice(0,10)
            .map(p=>p.cantidadVendida),
        'Cantidad'
    );

    createLineChart(
        'monthlyChart',
        data.monthly
            .map(m=>m.mes),
        data.monthly
            .map(m=>m.montoTotal)
    );

    createPieChart(
        'segmentChart',
        data.segments
            .map(s=>s.nombre),
        data.segments
            .map(s=>s.cantidad)
    );
}

function createBarChart(id,labels,data,label){

    const ctx =
        document.getElementById(id);

    if(chartInstances[id])
        chartInstances[id].destroy();

    chartInstances[id] =
        new Chart(ctx,{
            type:'bar',
            data:{
                labels,
                datasets:[{
                    label,
                    data,
                    backgroundColor:
                        'rgba(102,126,234,.7)'
                }]
            }
        });
}

function createLineChart(id,labels,data){

    const ctx =
        document.getElementById(id);

    if(chartInstances[id])
        chartInstances[id].destroy();

    chartInstances[id] =
        new Chart(ctx,{
            type:'line',
            data:{
                labels,
                datasets:[{
                    data,
                    borderColor:'#667eea',
                    backgroundColor:'rgba(102,126,234,.1)',
                    fill:true
                }]
            }
        });
}

function createPieChart(id,labels,data){

    const ctx =
        document.getElementById(id);

    if(chartInstances[id])
        chartInstances[id].destroy();

    chartInstances[id] =
        new Chart(ctx,{
            type:'doughnut',
            data:{
                labels,
                datasets:[{
                    data,
                    backgroundColor:[
                        '#64b5f6',
                        '#ba68c8',
                        '#81c784',
                        '#ffb74d'
                    ]
                }]
            }
        });
}

function createDynamicTable(
    tableId,
    data
){

    if(!data || !data.length)
        return;

    const table =
        document.getElementById(tableId);

    const thead =
        table.querySelector('thead');

    const tbody =
        table.querySelector('tbody');

    thead.innerHTML = '';
    tbody.innerHTML = '';

    const columns =
        Object.keys(data[0]);

    const tr =
        document.createElement('tr');

    columns.forEach(col=>{

        const th =
            document.createElement('th');

        th.textContent = col;

        tr.appendChild(th);
    });

    thead.appendChild(tr);

    data.forEach(row=>{

        const tr =
            document.createElement('tr');

        columns.forEach(col=>{

            const td =
                document.createElement('td');

            let value =
                row[col];

            if(Array.isArray(value)){
                value =
                    value.join(', ');
            }

            td.textContent = value;

            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });
}

function switchTab(tab,event){

    document
        .querySelectorAll('.tab-btn')
        .forEach(btn=>{
            btn.classList.remove('active');
        });

    document
        .querySelectorAll('.tab-content')
        .forEach(tab=>{
            tab.classList.remove('active');
        });

    event.target.classList.add('active');

    document
        .getElementById(
            tab+'-tab'
        )
        .classList.add('active');
}

async function downloadExcel(){

    const response =
        await fetch(
            '/api/download-report',
            {
                method:'POST',
                headers:{
                    'Content-Type':
                        'application/json'
                },
                body:JSON.stringify(
                    currentAnalysis
                )
            }
        );

    const blob =
        await response.blob();

    const url =
        window.URL.createObjectURL(blob);

    const a =
        document.createElement('a');

    a.href = url;

    a.download =
        'analisis.xlsx';

    a.click();
}

async function downloadCSV(){

    const response =
        await fetch(
            '/api/download-csv',
            {
                method:'POST',
                headers:{
                    'Content-Type':
                        'application/json'
                },
                body:JSON.stringify(
                    currentAnalysis
                )
            }
        );

    const blob =
        await response.blob();

    const url =
        window.URL.createObjectURL(blob);

    const a =
        document.createElement('a');

    a.href = url;

    a.download =
        'analisis.csv';

    a.click();
}

function resetApp(){

    fileInput.value = '';

    uploadedFiles = [];

    renderFileList();

    currentAnalysis = null;

    document
        .getElementById('resultsSection')
        .classList.remove('show');
}

function showError(message){

    const error =
        document.getElementById('error');

    error.textContent = message;

    error.classList.add('show');
}

</script>

</body>
</html>
